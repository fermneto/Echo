<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout: cabeçalho fixo com abas; cada aba é uma coluna de leitura com peças interativas (conversas, fluxos, calculadoras). Pista teal = trabalho, bastão laranja = passagem. */
:root{
  --bg:#f3f7f8;--surface:#ffffff;--ink:#14282f;--muted:#536a72;--line:#cfdcdf;
  --track:#0f6e78;--track-soft:#d9edef;--baton:#c2500f;--baton-soft:#fbe8dc;--violet:#5a4fb0;--violet-soft:#e7e4f7;
  --good:#1f7a4d;--good-soft:#dff2e7;--bad:#a93232;--bad-soft:#f8e2e2;--warn:#8a6100;--warn-soft:#f6edcf;
  --on-accent:#ffffff;
  --display:"Bricolage Grotesque",Georgia,serif;--body:"Source Sans 3","Segoe UI",sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1b1f;--surface:#172529;--ink:#e6f0f2;--muted:#9db1b7;--line:#2c4047;
  --track:#4cb9c4;--track-soft:#17363b;--baton:#f0894c;--baton-soft:#3b2417;--violet:#a79cf0;--violet-soft:#2a2645;
  --good:#6dcb97;--good-soft:#17332a;--bad:#ee8f8f;--bad-soft:#3a1e1e;--warn:#e0bb5c;--warn-soft:#352c12;--on-accent:#0f1b1f;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1b1f;--surface:#172529;--ink:#e6f0f2;--muted:#9db1b7;--line:#2c4047;
  --track:#4cb9c4;--track-soft:#17363b;--baton:#f0894c;--baton-soft:#3b2417;--violet:#a79cf0;--violet-soft:#2a2645;
  --good:#6dcb97;--good-soft:#17332a;--bad:#ee8f8f;--bad-soft:#3a1e1e;--warn:#e0bb5c;--warn-soft:#352c12;--on-accent:#0f1b1f;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16.5px/1.6 var(--body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,h4{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(2.2rem,6vw,3.6rem);font-weight:700;letter-spacing:-.02em}
h2{font-size:clamp(1.45rem,3.4vw,1.95rem);font-weight:700}
h3{font-size:1.12rem;font-weight:700}
h4{font-size:.98rem;font-weight:700}
p{margin:0;max-width:70ch}
a{color:var(--track);text-underline-offset:2px}
code,.mono{font-family:var(--mono);font-size:.86em}
code{background:var(--track-soft);color:var(--ink);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}
ul,ol{margin:0;padding-left:1.25em;display:grid;gap:6px;max-width:72ch}
.small{font-size:.9rem;color:var(--muted)}
.label{font:600 .72rem/1.3 var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--baton)}
.lead{font-size:1.2rem;line-height:1.5;max-width:40em}
:focus-visible{outline:2px solid var(--baton);outline-offset:2px}

/* Cabeçalho */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{max-width:1120px;margin-inline:auto;display:flex;align-items:center;gap:14px;padding-block:10px 0}
.brand{display:flex;align-items:center;gap:10px;font:700 1.15rem/1 var(--display);flex:none}
.brand svg{width:28px;height:28px}
.tabs{max-width:1120px;margin-inline:auto;display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin;padding-top:6px}
.tab{appearance:none;border:0;background:none;color:var(--muted);font:600 .9rem/1 var(--body);padding:10px 12px 12px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--track);border-bottom-color:var(--track)}

main{max-width:1120px;margin-inline:auto;padding-block:36px 80px}
section.view{display:grid;gap:40px}
.block{display:grid;gap:16px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px;display:grid;gap:10px;align-content:start;min-width:0}
.rule{border-left:4px solid var(--baton);background:var(--baton-soft);padding:14px 16px;border-radius:0 6px 6px 0;display:grid;gap:6px}

/* Chips de estado */
.chip{display:inline-flex;align-items:center;gap:6px;font:600 .72rem/1.2 var(--mono);padding:5px 8px;border-radius:5px;background:var(--track-soft);color:var(--track);white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.violet{background:var(--violet-soft);color:var(--violet)}
.chip.baton{background:var(--baton-soft);color:var(--baton)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* Tabelas */
.scroll{overflow-x:auto;min-width:0}
table{border-collapse:collapse;width:100%;font-size:.93rem;background:var(--surface);border:1px solid var(--line);border-radius:8px}
th,td{text-align:left;vertical-align:top;padding:9px 12px;border-bottom:1px solid var(--line)}
th{font:600 .72rem/1.3 var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--bg)}
tr:last-child td{border-bottom:0}
td.c,th.c{text-align:center}
.num{font-variant-numeric:tabular-nums}

/* Ciclo de 24 h */
.day{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px;display:grid;gap:12px}
.timeline{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px}
.moment{appearance:none;text-align:left;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:12px;cursor:pointer;display:grid;gap:4px}
.moment b{font-family:var(--display);font-size:1rem}
.moment span{font-size:.82rem;color:var(--muted)}
.moment[aria-pressed="true"]{border-color:var(--track);background:var(--track-soft)}
.detail{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:8px}

/* Conversas */
.split{display:grid;grid-template-columns:minmax(0,280px) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:760px){.split{grid-template-columns:1fr}}
.list{display:grid;gap:4px;max-height:640px;overflow:auto;padding-right:2px}
@media (max-width:760px){.list{max-height:none;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}}
.item{appearance:none;font:inherit;color:inherit;text-align:left;background:none;border:1px solid transparent;border-radius:6px;padding:9px 11px;cursor:pointer;display:grid;gap:2px}
.item small{color:var(--muted);font-size:.8rem}
.item:hover{background:var(--surface)}
.item[aria-current="true"]{background:var(--surface);border-color:var(--line);box-shadow:inset 3px 0 0 var(--track)}
.group-label{font:600 .68rem/1.3 var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:10px 11px 2px}
.slack{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;min-width:0}
.slack-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line);font:600 .85rem/1.4 var(--mono);color:var(--muted)}
.msgs{display:grid;gap:14px;padding:16px}
.msg{display:grid;grid-template-columns:36px minmax(0,1fr);gap:10px}
.av{width:36px;height:36px;border-radius:6px;display:grid;place-items:center;font:700 .85rem/1 var(--display);color:var(--on-accent);background:var(--violet)}
.av.bot{background:var(--track)}
.av.gh{background:var(--ink);color:var(--surface)}
.who{font-weight:700;font-size:.92rem;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.who .tag{font:600 .64rem/1 var(--mono);text-transform:uppercase;letter-spacing:.06em;padding:3px 5px;border-radius:3px;background:var(--track-soft);color:var(--track)}
.who time{font:400 .75rem/1 var(--mono);color:var(--muted)}
.body{display:grid;gap:6px;overflow-wrap:anywhere}
.ephemeral{font-size:.85rem;color:var(--muted);font-style:italic}
.silent{border:1px dashed var(--line);border-radius:6px;padding:10px 12px;color:var(--muted);font-size:.9rem}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.sbtn{font:600 .82rem/1 var(--body);border:1px solid var(--line);border-radius:5px;padding:7px 11px;background:var(--bg);color:var(--ink)}
.sbtn.primary{background:var(--good);border-color:var(--good);color:var(--on-accent)}
.src{font-size:.82rem;color:var(--muted)}
.behind{border-top:1px solid var(--line);background:var(--bg);padding:16px;display:grid;gap:10px}
.behind ol{gap:5px;font-size:.92rem}

/* Fluxos */
.flowpick{display:flex;gap:6px;flex-wrap:wrap}
.fbtn{appearance:none;font:600 .82rem/1 var(--mono);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:9px 11px;cursor:pointer}
.fbtn[aria-pressed="true"]{background:var(--track);border-color:var(--track);color:var(--on-accent)}
.steps{counter-reset:s;display:grid;gap:0;list-style:none;padding:0;max-width:none}
.steps li{counter-increment:s;display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;padding-bottom:14px;position:relative}
.steps li::before{content:counter(s);width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:600 .78rem/1 var(--mono);background:var(--track-soft);color:var(--track)}
.steps li::after{content:"";position:absolute;left:13.5px;top:30px;bottom:2px;width:1px;background:var(--line)}
.steps li:last-child::after{display:none}

/* Estados */
.states{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.states .arrow{color:var(--muted);font-family:var(--mono)}

/* Calculadoras */
.calc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
@media (max-width:700px){.calc{grid-template-columns:1fr}}
.field{display:grid;gap:4px}
.field label{font-size:.88rem;font-weight:600}
.field input,.field select,input.search{font:inherit;font-size:.95rem;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);width:100%}
.out{background:var(--bg);border-radius:6px;padding:14px;display:grid;gap:8px;align-content:start}
.big{font:700 2rem/1 var(--display);font-variant-numeric:tabular-nums}
.meter{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--track);border-radius:5px;transition:width .2s}
.meter i.over{background:var(--bad)}
.formula{font:500 .86rem/1.5 var(--mono);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px 12px;overflow-x:auto}

/* Fases */
.phase{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.phase summary{cursor:pointer;list-style:none;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 16px}
.phase summary::-webkit-details-marker{display:none}
.phase .pn{font:700 .8rem/1 var(--mono);color:var(--muted);min-width:2.4em}
.phase .pt{font-weight:700}
.phase .pt small{display:block;font-weight:400;color:var(--muted);font-size:.86rem}
.phase .pb{padding:0 16px 16px 16px;display:grid;gap:10px;border-top:1px solid var(--line);padding-top:14px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);cursor:pointer}
.check input{margin-top:4px;accent-color:var(--good);width:16px;height:16px;flex:none}
.progress{font:600 .85rem/1 var(--mono);color:var(--muted)}

/* Demo */
.timer{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.clock{font:700 2.4rem/1 var(--mono);font-variant-numeric:tabular-nums}
.btn{appearance:none;font:600 .9rem/1 var(--body);border:1px solid var(--track);background:var(--track);color:var(--on-accent);border-radius:6px;padding:10px 14px;cursor:pointer}
.btn.ghost{background:none;color:var(--track)}
.segbar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--line);gap:2px}
.segbar span{background:var(--track-soft);transition:background .2s}
.segbar span.on{background:var(--baton)}
.segbar span.done{background:var(--track)}
.scene{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:16px;display:grid;gap:8px}
.scene.on{border-color:var(--baton);box-shadow:inset 4px 0 0 var(--baton)}
.scene h3{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.scene h3 span{font:600 .8rem/1 var(--mono);color:var(--muted)}

/* Arquitetura */
.pipe{display:grid;gap:6px}
.layer{display:grid;grid-template-columns:minmax(110px,150px) minmax(0,1fr);gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 14px}
.layer b{font:600 .74rem/1.2 var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--track)}
.down{text-align:center;color:var(--muted);font-family:var(--mono);line-height:1}
.mock{border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:14px;display:grid;gap:10px;min-width:0}
.mock-head{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.mock-line{display:flex;gap:3px;height:12px}.mock-line span{border-radius:3px;font-size:0}
.mock-line .t{background:var(--track)}.mock-line .p{background:var(--violet)}.mock-line .b{background:var(--bad)}
.mock-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px}
.mock-toggle{display:flex;gap:8px;align-items:center;font-size:.88rem;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px}
.mock-zones{display:flex;gap:6px;flex-wrap:wrap;font:600 .74rem/1 var(--mono);color:var(--muted)}.mock-zones span{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:5px 7px}
.mock-list{display:grid;gap:6px;max-width:none}.mock-list li{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mock-bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}.mock-bar i{display:block;height:100%;background:var(--track)}
.video{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:8px;background:linear-gradient(160deg,var(--track),var(--violet));display:grid;place-items:center;overflow:hidden}
.video .play{width:56px;height:56px;border-radius:50%;background:var(--surface);color:var(--track);display:grid;place-items:center;font-size:1.3rem}
.video .cap{position:absolute;left:10px;right:10px;bottom:10px;background:rgba(0,0,0,.65);color:#fff;font-size:.85rem;padding:6px 10px;border-radius:4px}
.video .dur{position:absolute;top:8px;right:10px;font:600 .75rem/1 var(--mono);color:#fff;background:rgba(0,0,0,.5);padding:4px 6px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
const $ = (s, r = document) => r.querySelector(s);
const TABS = [
  ["inicio","Início"],["construcao","Passo a passo"],["conexoes","Conexões"],["contas","Contas e variáveis"],["producao","Produção"],
  ["produto","Produto"],["interacoes","Interações"],["fluxos","Fluxos"],["painel","Painel"],
  ["arquitetura","Arquitetura"],["dados","Dados"],["regras","Regras"],["ia","IA e custos"],
  ["integracoes","Integrações"],["seguranca","Segurança"],["demo","Demo"]
];

/* ---------------- INÍCIO ---------------- */
const inicio = `
<div class="block">
  <span class="label">Gêmeos digitais para equipes distribuídas</span>
  <h1>O trabalho continua quando a pessoa não está.</h1>
  <p class="lead">Cada pessoa da equipe tem um gêmeo digital que conhece o trabalho dela. Ele responde quando ela está dormindo ou ausente, adianta revisões à noite e ajuda o líder a redistribuir tarefas sem sobrecarregar ninguém.</p>
  <p><em>"Ninguém trava esperando quem está dormindo ou de férias, ninguém fica sobrecarregado, e quem ajuda os outros finalmente aparece."</em></p>
</div>
<div class="grid3">
  <div class="card"><span class="label">Construção</span><h3>28 etapas, do repositório vazio à produção</h3><p class="small">Uma etapa por vez, com testes antes da próxima. Cada uma tem critério de pronto e pode ser marcada como concluída na aba Passo a passo.</p></div>
  <div class="card"><span class="label">Stack</span><h3>TypeScript de ponta a ponta</h3><p class="small">Next.js, Hono, Postgres com RLS, pg-boss, Drizzle, Vitest e Playwright, num monorepo pnpm + Turborepo.</p></div>
  <div class="card"><span class="label">IA</span><h3>Claude em três modos</h3><p class="small">API com ferramentas nas respostas, API de lotes na revisão noturna e Managed Agents na correção de código.</p></div>
  <div class="card"><span class="label">Conexões</span><h3>GitHub, Linear e Slack</h3><p class="small">Slack é canal de pergunta e resposta, não fonte de conhecimento. RH por aviso assinado.</p></div>
  <div class="card"><span class="label">Cérebro</span><h3>Notas no Postgres, espelho em Git</h3><p class="small">Markdown compatível com o Obsidian. A correção humana sempre vence.</p></div>
  <div class="card"><span class="label">Escopo</span><h3>Só funcionários</h3><p class="small">Prestadores de serviço e reuniões ficam fora da primeira versão.</p></div>
</div>
<div class="block">
  <h2>Regras invioláveis</h2>
  <div class="grid2">
    <div class="rule"><b>A IA não aprova código, não altera números e não muda tarefas</b><span class="small">Toda mudança sensível passa por aprovação registrada.</span></div>
    <div class="rule"><b>Sem mensagens privadas entre pessoas, sem tempo online</b><span class="small">O status do Slack é lido só na menção, e não é gravado.</span></div>
    <div class="rule"><b>Números vêm de regras fixas em <code>packages/domain</code></b><span class="small">O modelo só redige e explica. Um validador recusa número inventado.</span></div>
    <div class="rule"><b>Conteúdo de PR, Slack e notas é dado, nunca instrução</b><span class="small">Proteção contra injeção, com avaliação fixa em <code>evals/</code>.</span></div>
    <div class="rule"><b>O agente sempre se identifica</b><span class="small">"Agente de Fernando", nunca na primeira pessoa como o trabalhador.</span></div>
    <div class="rule"><b>Só dados sintéticos em demo, testes e seed</b><span class="small">Fernando, Eduardo e Yan têm o nome real, com trabalho sintético.</span></div>
  </div>
</div>
<div class="block">
  <h2>Como usar este guia</h2>
  <ol>
    <li><b>Passo a passo:</b> siga as etapas em ordem. Cada uma diz o que construir, onde fica no código, que testes escrever e quando está pronta.</li>
    <li><b>Conexões:</b> depois da demo, amplie o agente com as ferramentas que os clientes já usam, em ondas.</li>
    <li><b>Contas e variáveis:</b> crie as contas no momento indicado em cada etapa, não todas de uma vez.</li>
    <li><b>Produção:</b> depois da demo, o caminho até clientes reais.</li>
    <li><b>Abas de referência:</b> Produto, Interações, Fluxos, Painel, Arquitetura, Dados, Regras, IA, Integrações e Segurança descrevem o comportamento esperado. Consulte-as durante cada etapa.</li>
  </ol>

 ["Custo, rastro e ganhos",20,"Marina","Em Gestão → Custo e execuções, quanto custou cada coisa. Em Gestão → Ganhos, espera evitada e revisões antes e depois, só em totais."]

/* Regras: carga */
const fmt = n => n.toLocaleString("pt-BR",{maximumFractionDigits:2});
function calcLoad(){
  const v=id=>Math.max(0, +$(id).value||0);
  const carga = v("#c-size") + v("#c-rev")*0.5 + v("#c-due") + (+$("#c-adj").value||0);
  const dias = Math.min(7, v("#c-days")); const limite = Math.max(1,v("#c-lim")) * (7-dias)/7;
  const pct = limite>0 ? carga/limite : Infinity; const over = carga>limite;
  $("#c-out").innerHTML = `<span class="label">Cartão de capacidade</span><div class="big">${fmt(carga)} <span class="small">de ${fmt(limite)}</span></div><div class="meter"><i class="${over?'over':''}" style="width:${Math.min(100,(isFinite(pct)?pct:1)*100)}%"></i></div>${over?'<span class="chip bad">acima do limite: não recebe tarefas no plano</span>':'<span class="chip good">com folga: '+fmt(limite-carga)+' pontos</span>'}<p class="small">${dias===7?'Ausente a semana inteira: limite zero, nenhuma tarefa nova.':'Ausência reduz o limite, não a carga.'}</p>`;
}
["#c-size","#c-rev","#c-due","#c-adj","#c-lim","#c-days"].forEach(id=>$(id).addEventListener("input",calcLoad)); calcLoad();

/* Regras: quem sabe */
function calcTopic(){
  const v=id=>Math.max(0,+$(id).value||0);
  const soma = v("#q-pr")*3 + v("#q-help")*3 + v("#q-rev")*2 + v("#q-task") + (+$("#q-prof").value);
  const score = soma * (+$("#q-rec").value); const s=$("#q-st").value;
  let verdict;
  if(s==="excl") verdict='<span class="chip bad">não aparece: a exclusão vence qualquer pontuação</span>';
  else if(s==="ferias") verdict='<span class="chip warn">não é indicada; se for a única com evidência, a resposta informa a data de volta</span>';
  else if(score<=0) verdict='<span class="chip bad">sem evidência no tema</span>';
  else if(s==="over") verdict='<span class="chip warn">aparece no fim, com aviso de carga</span>';
  else verdict='<span class="chip good">aparece entre os disponíveis, pela pontuação</span>';
  $("#q-out").innerHTML = `<span class="label">Pontuação</span><div class="big">${fmt(score)}</div><p class="small">${fmt(soma)} pontos de evidência × recência ${$("#q-rec").value.replace(".",",")}</p>${verdict}`;
}
["#q-pr","#q-help","#q-rev","#q-task","#q-prof","#q-rec","#q-st"].forEach(id=>$(id).addEventListener("input",calcTopic)); calcTopic();

/* IA: custo */
const freq = COSTS.map(c=>c[7]);
function calcCost(){
  const people = Math.max(1,+$("#k-people").value||1);
  let day=0;
  const rows = COSTS.map((c,i)=>{ const unit=(c[2]*c[4]+c[3]*c[5])/1e6*c[6]; const tot=unit*freq[i]; day+=tot; return `<tr><td><b>${c[0]}</b><br><span class="small">${c[1]}</span></td><td class="num">${(c[2]/1000)} mil / ${(c[3]/1000).toLocaleString("pt-BR")} mil</td><td class="num">US$ ${unit.toFixed(3).replace(".",",")}</td><td><input aria-label="Frequência diária de ${c[0]}" data-i="${i}" type="number" min="0" step="0.1" value="${freq[i]}" style="width:80px;font:inherit;padding:4px 6px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink)"></td><td class="num">US$ ${tot.toFixed(3).replace(".",",")}</td></tr>`; }).join("");
  $("#costTable").innerHTML = `<tr><th>Execução por pessoa</th><th>Tokens (entrada / saída)</th><th>Custo unitário</th><th>Por dia</th><th>Total diário</th></tr>${rows}`;
  const month = day*21; const org = month*people;
  $("#costOut").innerHTML = `<div class="card"><span class="label">Por pessoa por dia</span><div class="big">US$ ${day.toFixed(2).replace(".",",")}</div></div><div class="card"><span class="label">Por pessoa por mês (21 dias)</span><div class="big">US$ ${month.toFixed(2).replace(".",",")}</div></div><div class="card"><span class="label">Empresa por mês · ${people} pessoas</span><div class="big">US$ ${fmt(Math.round(org))}</div><p class="small">${org>50?'Acima do limite padrão de US$ 50: ajuste em Configuração.':'Dentro do limite padrão de US$ 50.'}</p></div>`;
}
$("#costTable").addEventListener("change", e=>{ const i=e.target.dataset.i; if(i!==undefined){ freq[i]=Math.max(0,+e.target.value||0); calcCost(); } });
$("#k-people").addEventListener("input", calcCost); calcCost();

/* Demo: cronômetro */
let t0=null, acc=0, tick=null;
const total = SCENES.reduce((a,s)=>a+s[1],0);
function elapsed(){ return acc + (t0? (Date.now()-t0)/1000 : 0); }
function paint(){
  const e=elapsed(); const m=Math.floor(e/60), s=Math.floor(e%60);
  $("#clock").textContent = `${m}:${String(s).padStart(2,"0")}`;
  let start=0, cur=-1;
  SCENES.forEach((sc,i)=>{ if(e>=start && e<start+sc[1]) cur=i; start+=sc[1]; });
  if(e>=total) cur=SCENES.length;
  document.querySelectorAll("#segbar span").forEach((el,i)=>{ el.className = i<cur?"done":(i===cur?"on":""); });
  document.querySelectorAll("#sceneList .scene").forEach((el,i)=>el.classList.toggle("on", i===cur));
  $("#tNow").textContent = cur===-1 ? `${total} s no total` : (cur>=SCENES.length ? "Tempo esgotado" : `Agora: ${SCENES[cur][0]}`);
}
$("#tStart").addEventListener("click", ()=>{
  if(t0){ acc=elapsed(); t0=null; clearInterval(tick); $("#tStart").textContent="Continuar"; }
  else { t0=Date.now(); tick=setInterval(paint,250); $("#tStart").textContent="Pausar"; }
  paint();
});
$("#tReset").addEventListener("click", ()=>{ t0=null; acc=0; clearInterval(tick); $("#tStart").textContent="Começar"; paint(); });
paint();
