# Blueprint da Render para o evento: quatro serviços e o banco.
# Variáveis com sync: false são pedidas só na criação; as novas entram pelo painel de cada serviço.
databases:
  - name: echo-db
    databaseName: echo
    user: echo
    plan: basic-256mb
    postgresMajorVersion: "17"
    region: oregon

envVarGroups:
  - name: echo-shared
    envVars:
      - key: LOG_LEVEL
        value: info
      - key: DEMO_MODE
        value: "true"
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: LANGFUSE_BASE_URL
        sync: false

services:
  - type: web
    name: echo-api
    runtime: docker
    region: oregon
    plan: starter
    dockerfilePath: ./infra/Dockerfile.node
    dockerContext: .
    healthCheckPath: /ready
    # Sem shell e com caminho absoluto.
    preDeployCommand: node /app/packages/db/src/migrate.ts
    envVars:
      - key: APP
        value: api
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: SLACK_SIGNING_SECRET
        sync: false
      - key: LINEAR_WEBHOOK_SECRET
        sync: false
      - key: VERCEL_WEBHOOK_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: echo-db
          property: connectionString
      - fromGroup: echo-shared

  - type: web
    name: echo-web
    runtime: docker
    region: oregon
    plan: starter
    dockerfilePath: ./infra/Dockerfile.web
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: echo-db
          property: connectionString
      - key: SLACK_CLIENT_ID
        sync: false
      - key: SLACK_CLIENT_SECRET
        sync: false
      # Endereço público do echo-web (o retorno do login é PANEL_URL/api/sessao/slack/retorno).
      - key: PANEL_URL
        sync: false
      - key: DEMO_SLACK_TEAM_ID
        sync: false
      - fromGroup: echo-shared

  - type: worker
    name: echo-worker
    runtime: docker
    region: oregon
    plan: starter
    dockerfilePath: ./infra/Dockerfile.node
    dockerContext: .
    envVars:
      - key: APP
        value: worker
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_PRIVATE_KEY
        sync: false
      - key: LINEAR_CLIENT_ID
        sync: false
      - key: LINEAR_CLIENT_SECRET
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_EMAIL
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_KEY
        sync: false
      - key: MICROSOFT_CLIENT_ID
        sync: false
      - key: MICROSOFT_CLIENT_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: echo-db
          property: connectionString
      # Endereço público do painel (botão "Editar no painel" da nota do dia). Definir no painel da Render.
      - key: WEB_URL
        sync: false
      - fromGroup: echo-shared

  - type: worker
    name: echo-reviewer
    runtime: docker
    region: oregon
    plan: starter
    dockerfilePath: ./infra/Dockerfile.node
    dockerContext: .
    envVars:
      - key: APP
        value: reviewer
      - key: DATABASE_URL
        fromDatabase:
          name: echo-db
          property: connectionString
      - fromGroup: echo-shared
      # Correção (etapa 10): IDs de `pnpm --filter @echo/reviewer provision`.
      - key: FIX_AGENT_ID
        sync: false
      - key: FIX_ENVIRONMENT_ID
        sync: false
