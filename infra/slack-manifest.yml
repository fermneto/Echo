# Manifesto do app do Slack do Echo. Em api.slack.com/apps → Create New App → From a manifest,
# cole este arquivo trocando <API> pelo endereço público da API e <PAINEL> pelo do painel (túnel ou Render).
display_information:
  name: Echo
  description: Gêmeos digitais para equipes distribuídas. Powered by Claude.
features:
  bot_user:
    display_name: Echo
    always_online: true
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
oauth_config:
  # Retorno do login no painel ("Sign in with Slack").
  redirect_urls:
    - https://<PAINEL>/api/sessao/slack/retorno
  scopes:
    user:
      - openid
    bot:
      - app_mentions:read
      - channels:history
      - chat:write
      - chat:write.customize
      - files:write
      - users:read
      - im:history
      - im:write
      - reactions:read
settings:
  event_subscriptions:
    request_url: https://<API>/webhooks/slack
    bot_events:
      - app_mention
      - message.channels
      - message.im
      - reaction_added
  interactivity:
    is_enabled: true
    request_url: https://<API>/webhooks/slack/interacoes
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
