name: Avaliação

# Usa o modelo real e gasta créditos, então só roda sob demanda.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evals:
    name: Avaliação fixa de segurança
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: echo
          POSTGRES_PASSWORD: echo
          POSTGRES_DB: echo
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U echo -d echo"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgres://echo:echo@localhost:5433/echo
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm evals
