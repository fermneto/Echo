services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: echo
      POSTGRES_PASSWORD: echo
      POSTGRES_DB: echo
    ports:
      - "5433:5432"
    volumes:
      - echo-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U echo -d echo"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  echo-db:
